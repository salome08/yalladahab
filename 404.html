<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Yalla Dahab</title>
  <script>
    // Annonce publiée depuis peu : sa page de partage n'est pas encore créée, on ouvre la fiche.
    (function () {
      var m = window.location.pathname.match(/^\/stay\/([A-Za-z0-9_-]+?)(\.html)?\/?$/);
      if (m) window.location.replace("/listing.html?id=" + encodeURIComponent(m[1]));
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8f4; color: #14212b; font-family: "Plus Jakarta Sans", system-ui, sans-serif; text-align: center; padding: 16px; }
    @media (prefers-color-scheme: dark) { body { background: #0d1418; color: #e7edf0; } }
    a { display: inline-block; margin-top: 16px; background: #0b6e78; color: #fff; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 999px; }
  </style>
</head>
<body>
  <div>
    <h1>This page does not exist</h1>

</html>
