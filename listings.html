<body data-page="listings">
<header id="site-header"></header>
<main>

<div class="container">
  <div class="page-head"><h1 data-i18n="listings.title"></h1></div>
  <div class="banners" data-banner-slot="search"></div>
  <div class="listings-layout">
    <form class="filters" id="filters">
      <label><span data-i18n="search.area"></span><select name="area"></select></label>
      <label><span data-i18n="search.type"></span><select name="type"></select></label>
      <label><span data-i18n="search.stay"></span>
        <select name="stay"><option value="" data-i18n="search.nightly"></option><option value="monthly" data-i18n="search.monthly"></option></select>
      </label>
      <label><span data-i18n="search.maxPrice"></span><input name="max" type="number" min="0" step="100" inputmode="numeric"></label>
      <label class="check"><input type="checkbox" name="workspace"> <span data-i18n="search.workspace"></span></label>
      <label class="check"><input type="checkbox" name="verified"> <span data-i18n="search.verified"></span></label>
      <div class="filter-actions"><button class="btn btn-ghost" type="reset" data-i18n="search.reset"></button></div>
    </form>
    <section>
      <p class="muted" id="results-count"></p>
      <div class="grid" id="results"></div>
    </section>
  </div>
</div>
</main>
<footer id="site-footer"></footer>
