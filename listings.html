<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stays in Dahab · Yalla Dahab</title>
  <meta name="description" content="Studios, apartments, villas and rooms in Dahab, by night or by month.">
  <meta property="og:title" content="Stays in Dahab · Yalla Dahab">
  <meta property="og:description" content="Studios, apartments, villas and rooms in Dahab, by night or by month.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%230e7c86'/><path d='M50 4a46 46 0 0 1 0 92z' fill='%23ff7a59'/></svg>">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="listings">
<header id="site-header"></header>
<main>

<div class="container">
  <div class="page-head"><h1 data-i18n="listings.title"></h1></div>
  <div class="banners" data-banner-slot="search"></div>
  <div class="listings-layout">
    <form class="filters" id="filters">
      <label><span data-i18n="search.area"></span><select name="area"></select></label>
      <label><span data-i18n="search.type"></span><select name="type"></select></label>
      <label><span data-i18n="search.stay"></span>
        <select name="stay"><option value="" data-i18n="search.nightly"></option><option value="monthly" data-i18n="search.monthly"></option></select>
      </label>
      <label><span data-i18n="search.maxPrice"></span><input name="max" type="number" min="0" step="100" inputmode="numeric"></label>
      <label class="check"><input type="checkbox" name="workspace"> <span data-i18n="search.workspace"></span></label>
      <label class="check"><input type="checkbox" name="verified"> <span data-i18n="search.verified"></span></label>
      <div class="filter-actions"><button class="btn btn-ghost" type="reset" data-i18n="search.reset"></button></div>
    </form>
    <section>
      <p class="muted" id="results-count"></p>
      <div class="grid" id="results"></div>
    </section>
  </div>
</div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/data/listings.js"></script>
<script src="assets/data/events.js"></script>
<script src="assets/data/ads.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
